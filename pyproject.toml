[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-mgr"
version = "1.0.0"
description = "Universal multi-provider manager and reasoning-blob session bridge for OpenAI Codex CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = [
    "codex",
    "openai",
    "agentrouter",
    "openrouter",
    "anthropic",
    "deepseek",
    "ollama",
    "cli",
    "tui",
    "session-manager"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities"
]
dependencies = [
    "rich>=13.7.0",
    "inquirerpy>=0.3.4",
    "tomli-w>=1.0.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "httpx>=0.27.0",
    "pydantic>=2.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0"
]

[project.scripts]
cmgr = "codex_mgr.cli:main"
codex-mgr = "codex_mgr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_mgr"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"


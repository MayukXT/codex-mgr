[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cmgr-cli"
version = "1.0.0"
description = "Providers, models, and session recovery for Codex CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = [
    "codex",
    "openai",
    "agentrouter",
    "openrouter",
    "anthropic",
    "deepseek",
    "ollama",
    "cli",
    "tui",
    "session-manager"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities"
]
dependencies = [
    "rich>=13.7.0",
    "inquirerpy>=0.3.4",
    "tomlkit>=0.13.2,<1",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "pydantic>=2.6.0",
    "packaging>=23.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "jsonschema>=4.21.0",
    "build>=1.2"
]

[project.scripts]
cmgr = "codex_mgr.cli:main"
codex-mgr = "codex_mgr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_mgr"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/wiki/", "scripts/check_distribution.py", ".github/workflows/ci.yml", "README.md", "FORDEV.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

